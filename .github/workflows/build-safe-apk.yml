name: Build KidsMonnter Safe APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'apk/**'
      - 'DOWNLOAD_APK.md'

concurrency:
  group: kidsmonnter-safe-apk-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-safe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      KEYSTORE_PASSWORD: KidsMonnter-Release-2026
      KEY_PASSWORD: KidsMonnter-Release-2026
      KEY_ALIAS: kidsmonnter

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore signing key
        uses: actions/cache@v4
        with:
          path: .signing/kidsmonnter-release.jks
          key: kidsmonnter-release-keystore-v2

      - name: Prepare signing key
        run: |
          set -euo pipefail
          mkdir -p .signing
          if [ ! -s .signing/kidsmonnter-release.jks ]; then
            keytool -genkeypair \
              -keystore .signing/kidsmonnter-release.jks \
              -storepass "$KEYSTORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 4096 -validity 10000 \
              -dname "CN=KidsMonnter, OU=Android Release, O=KidsMonnter, L=Amman, C=JO"
          fi

      - name: Generate Android project
        run: flutter create --platforms=android --org com.explapp --no-pub .

      - name: Prepare Play Protect friendly sources
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest_path = Path('native/AndroidManifest.xml')
          manifest = manifest_path.read_text(encoding='utf-8')

          # Remove components and permission patterns that commonly trigger sideload warnings.
          manifest = re.sub(r'\s*<uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"\s*/>', '', manifest)
          manifest = re.sub(r'\s*<receiver\s+android:name="\.KidsMonnterDeviceAdminReceiver".*?</receiver>', '', manifest, flags=re.S)
          manifest = re.sub(r'\s*<activity\s+android:name="\.ForceStopPinActivity".*?/>', '', manifest, flags=re.S)
          manifest = re.sub(r'\s*<activity\s+android:name="\.UninstallPinActivity".*?/>', '', manifest, flags=re.S)
          manifest = re.sub(r'\s*<service\s+android:name="\.UninstallGuardAccessibilityService".*?</service>', '', manifest, flags=re.S)
          manifest_path.write_text(manifest, encoding='utf-8')

          main_path = Path('lib/main.dart')
          main = main_path.read_text(encoding='utf-8')
          main = re.sub(
              r'bool get _runtimeSetupReady =>.*?;\s*// MANDATORY_DEVICE_ADMIN_PROTECTION_MARKER',
              'bool get _runtimeSetupReady => true; // SAFE_BUILD_SETUP_READY',
              main,
              count=1,
              flags=re.S,
          )
          safe_card = r'''
            Card(
              child: ListTile(
                leading: const Icon(Icons.verified_user_outlined),
                title: const Text(
                  'نسخة آمنة للتثبيت المباشر',
                  style: TextStyle(fontWeight: FontWeight.bold),
                ),
                subtitle: const Text(
                  'هذه النسخة لا تستخدم خدمة إمكانية الوصول ولا تمنع حذف التطبيق، لتقليل تحذيرات Play Protect.',
                ),
              ),
            ),
            const SizedBox(height: 10),
            const Divider(height: 24),'''
          main = re.sub(
              r'\s*// DEFAULT_UNINSTALL_PROTECTION_UI_MARKER.*?const Divider\(height: 24\),',
              '\n' + safe_card,
              main,
              count=1,
              flags=re.S,
          )
          main_path.write_text(main, encoding='utf-8')

          kotlin_path = Path('native/MainActivityV2.kt')
          kotlin = kotlin_path.read_text(encoding='utf-8')

          kotlin = re.sub(
              r'private fun Context\.isUninstallGuardAccessibilityEnabled\(\): Boolean \{.*?\n\}',
              'private fun Context.isUninstallGuardAccessibilityEnabled(): Boolean = false',
              kotlin,
              count=1,
              flags=re.S,
          )
          kotlin = re.sub(
              r'\s*// MANDATORY_DEVICE_OWNER_SETUP_MARKER\s*val missing = mutableListOf<String>\(\)\s*// MANDATORY_DEVICE_ADMIN_PROTECTION_MARKER\s*val dpm = getSystemService\(Context\.DEVICE_POLICY_SERVICE\) as DevicePolicyManager\s*val admin = ComponentName\(this, KidsMonnterDeviceAdminReceiver::class\.java\)\s*if \(!dpm\.isAdminActive\(admin\)\) missing\.add\("device_admin"\)',
              '\n                    val missing = mutableListOf<String>()\n                    // Safe build has no Device Admin or Accessibility uninstall guard.',
              kotlin,
              count=1,
              flags=re.S,
          )
          kotlin = kotlin.replace('                    if (!isUninstallGuardAccessibilityEnabled()) missing.add("uninstall_guard")\n', '')
          kotlin = kotlin.replace('                    if (!Settings.canDrawOverlays(this)) missing.add("overlay")\n', '')
          kotlin = kotlin.replace('        ensureUninstallProtection()\n        MethodChannel(', '        MethodChannel(', 1)
          kotlin = kotlin.replace(
              '                    ensureUninstallProtection()\n                    appendGuardLog("PROTECTION_ENABLED"',
              '                    appendGuardLog("PROTECTION_ENABLED"',
              1,
          )

          # Remove PIN/uninstall/accessibility guard activities and service classes from bytecode.
          kotlin = re.sub(
              r'\n// UNINSTALL_GUARD_CLASS_ORDER_MARKER.*?\nclass BootReceiver',
              '\n\nclass BootReceiver',
              kotlin,
              count=1,
              flags=re.S,
          )
          kotlin_path.write_text(kotlin, encoding='utf-8')

          checks = {
              'no accessibility service in manifest': 'UninstallGuardAccessibilityService' not in manifest,
              'no device admin receiver in manifest': 'KidsMonnterDeviceAdminReceiver' not in manifest,
              'no overlay permission': 'SYSTEM_ALERT_WINDOW' not in manifest,
              'safe runtime gate': 'SAFE_BUILD_SETUP_READY' in main,
              'safe disclosure card': 'نسخة آمنة للتثبيت المباشر' in main,
              'no uninstall guard requirement': 'missing.add("uninstall_guard")' not in kotlin,
              'no device admin requirement': 'missing.add("device_admin")' not in kotlin,
              'no overlay requirement': 'missing.add("overlay")' not in kotlin,
              'no accessibility service class': 'class UninstallGuardAccessibilityService' not in kotlin,
              'no uninstall PIN activity class': 'class UninstallPinActivity' not in kotlin,
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit('Safe source preparation failed: ' + ', '.join(failed))
          PY

      - name: Install native Android implementation
        run: |
          set -euo pipefail
          rm -f test/widget_test.dart
          mkdir -p android/app/src/main/kotlin/com/explapp/kidstimeguard
          cp native/MainActivityV2.kt android/app/src/main/kotlin/com/explapp/kidstimeguard/MainActivity.kt
          cp native/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          rm -rf android/app/src/main/kotlin/com/explapp/kidsmonnter
          rm -f android/app/src/main/res/xml/device_admin_receiver.xml
          rm -f android/app/src/main/res/xml/uninstall_guard_accessibility.xml
          sed -i 's/com.explapp.kidsmonnter/com.explapp.kidstimeguard/g' android/app/build.gradle.kts
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/g' android/app/build.gradle.kts

      - name: Install packages
        run: flutter pub get

      - name: Verify safe prepared sources
        run: |
          set -euo pipefail
          ! grep -q 'BIND_ACCESSIBILITY_SERVICE' android/app/src/main/AndroidManifest.xml
          ! grep -q 'BIND_DEVICE_ADMIN' android/app/src/main/AndroidManifest.xml
          ! grep -q 'SYSTEM_ALERT_WINDOW' android/app/src/main/AndroidManifest.xml
          ! grep -q 'class UninstallGuardAccessibilityService' android/app/src/main/kotlin/com/explapp/kidstimeguard/MainActivity.kt
          ! grep -q 'class UninstallPinActivity' android/app/src/main/kotlin/com/explapp/kidstimeguard/MainActivity.kt
          ! grep -q 'missing.add("uninstall_guard")' android/app/src/main/kotlin/com/explapp/kidstimeguard/MainActivity.kt

      - name: Clean Gradle state
        run: |
          flutter clean
          rm -rf android/.gradle

      - name: Build safe release APK
        run: flutter build apk --release

      - name: Sign and verify safe APK
        run: |
          set -euo pipefail
          INPUT_APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$INPUT_APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          mkdir -p dist-safe
          "$APKSIGNER" sign \
            --ks .signing/kidsmonnter-release.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out dist-safe/KidsMonnter-Safe.apk \
            "$INPUT_APK"
          "$APKSIGNER" verify --verbose --print-certs dist-safe/KidsMonnter-Safe.apk | tee dist-safe/KidsMonnter-Safe-cert.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' dist-safe/KidsMonnter-Safe-cert.txt
          sha256sum dist-safe/KidsMonnter-Safe.apk | sed 's#dist-safe/KidsMonnter-Safe.apk#KidsMonnter-Safe.apk#' > dist-safe/KidsMonnter-Safe.sha256

      - name: Upload safe artifact
        uses: actions/upload-artifact@v4
        with:
          name: KidsMonnter-Safe-${{ github.sha }}
          path: dist-safe/
          if-no-files-found: error

      - name: Publish safe APK to main
        run: |
          set -euo pipefail
          mkdir -p apk
          cp dist-safe/KidsMonnter-Safe.apk apk/KidsMonnter-Safe.apk
          cp dist-safe/KidsMonnter-Safe-cert.txt apk/KidsMonnter-Safe-cert.txt
          cp dist-safe/KidsMonnter-Safe.sha256 apk/KidsMonnter-Safe.sha256
          cat > DOWNLOAD_APK.md <<'EOF'
          # تحميل تطبيق KidsMonnter

          ## النسخة الآمنة للتثبيت المباشر
          [تحميل KidsMonnter Safe APK](./apk/KidsMonnter-Safe.apk)

          - لا تستخدم Accessibility.
          - لا تستخدم Device Admin أو Device Owner.
          - لا تمنع حذف التطبيق.
          - مصممة لتقليل تحذيرات Play Protect عند التثبيت المباشر.

          ## نسخة الحماية القوية
          [تحميل KidsMonnter Guard APK](./apk/KidsMonnter.apk)

          - تستخدم Accessibility لحماية الحذف.
          - قد يعرض Android أو Play Protect تحذيرًا عند التثبيت الجانبي.

          ### التحقق
          - [بصمة النسخة الآمنة](./apk/KidsMonnter-Safe.sha256)
          - [شهادة النسخة الآمنة](./apk/KidsMonnter-Safe-cert.txt)
          - [بصمة نسخة الحماية](./apk/KidsMonnter.sha256)
          - [شهادة نسخة الحماية](./apk/KidsMonnter-cert.txt)
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk/KidsMonnter-Safe.apk apk/KidsMonnter-Safe-cert.txt apk/KidsMonnter-Safe.sha256 DOWNLOAD_APK.md
          git diff --cached --quiet || git commit -m "بناء KidsMonnter Safe APK للتثبيت المباشر"
          git push origin HEAD:main
