name: Build KidsMonnter Smart APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'native/**'
      - 'tool/prepare_smart_protection.py'
      - 'pubspec.yaml'
      - '.github/workflows/build-smart-apk.yml'

concurrency:
  group: kidsmonnter-smart-apk-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      KEYSTORE_PASSWORD: KidsMonnter-Release-2026
      KEY_PASSWORD: KidsMonnter-Release-2026
      KEY_ALIAS: kidsmonnter

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore signing key
        uses: actions/cache@v4
        with:
          path: .signing/kidsmonnter-release.jks
          key: kidsmonnter-release-keystore-v2

      - name: Prepare signing key
        run: |
          set -euo pipefail
          mkdir -p .signing
          if [ ! -s .signing/kidsmonnter-release.jks ]; then
            keytool -genkeypair \
              -keystore .signing/kidsmonnter-release.jks \
              -storepass "$KEYSTORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 4096 -validity 10000 \
              -dname "CN=KidsMonnter, OU=Android Release, O=KidsMonnter, L=Amman, C=JO"
          fi

      - name: Generate Android project
        run: flutter create --platforms=android --org com.explapp --no-pub .

      - name: Prepare smart protection modes
        run: |
          set -euo pipefail
          python3 tool/prepare_smart_protection.py

      - name: Install native Android implementation
        run: |
          set -euo pipefail
          rm -f test/widget_test.dart
          mkdir -p android/app/src/main/kotlin/com/explapp/kidstimeguard
          cp native/MainActivityV2.kt android/app/src/main/kotlin/com/explapp/kidstimeguard/MainActivity.kt
          cp native/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          rm -rf android/app/src/main/kotlin/com/explapp/kidsmonnter
          rm -f android/app/src/main/res/xml/device_admin_receiver.xml
          mkdir -p android/app/src/main/res/xml android/app/src/main/res/values
          cat > android/app/src/main/res/xml/uninstall_guard_accessibility.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged|typeViewClicked|typeViewSelected"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagReportViewIds|flagRetrieveInteractiveWindows|flagIncludeNotImportantViews"
              android:canRetrieveWindowContent="true"
              android:description="@string/uninstall_guard_description"
              android:notificationTimeout="80" />
          XML
          cat > android/app/src/main/res/values/kidsmonnter_strings.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="uninstall_guard_description">تراقب هذه الخدمة شاشات النظام الخاصة بحذف KidsMonnter أو تعطيله عند اختيار الحماية القصوى فقط، وتطلب رمز ولي الأمر. لا ترسل محتوى الشاشة خارج الجهاز.</string>
          </resources>
          XML
          sed -i 's/com.explapp.kidsmonnter/com.explapp.kidstimeguard/g' android/app/build.gradle.kts
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/g' android/app/build.gradle.kts

      - name: Verify smart sources
        run: |
          set -euo pipefail
          grep -q 'SMART_PROTECTION_MODE_UI' lib/main.dart
          grep -q 'setProtectionMode' native/MainActivityV2.kt
          grep -q 'protectionMode' native/MainActivityV2.kt
          grep -q 'UninstallGuardAccessibilityService' native/AndroidManifest.xml
          ! grep -q 'KidsMonnterDeviceAdminReceiver' native/AndroidManifest.xml
          ! grep -q 'missing.add("device_admin")' native/MainActivityV2.kt
          ! grep -q 'missing.add("overlay")' native/MainActivityV2.kt

      - name: Install packages
        run: flutter pub get

      - name: Clean Gradle state
        run: |
          flutter clean
          rm -rf android/.gradle

      - name: Build release APK
        run: flutter build apk --release

      - name: Sign and verify APK
        run: |
          set -euo pipefail
          INPUT_APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$INPUT_APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          mkdir -p dist
          "$APKSIGNER" sign \
            --ks .signing/kidsmonnter-release.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out dist/KidsMonnter-Smart.apk \
            "$INPUT_APK"
          "$APKSIGNER" verify --verbose --print-certs dist/KidsMonnter-Smart.apk | tee dist/KidsMonnter-Smart-cert.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' dist/KidsMonnter-Smart-cert.txt
          sha256sum dist/KidsMonnter-Smart.apk | sed 's#dist/KidsMonnter-Smart.apk#KidsMonnter-Smart.apk#' > dist/KidsMonnter-Smart.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KidsMonnter-Smart-${{ github.sha }}
          path: dist/
          if-no-files-found: error

      - name: Publish Smart APK to main
        run: |
          set -euo pipefail
          mkdir -p apk
          cp dist/KidsMonnter-Smart.apk apk/KidsMonnter-Smart.apk
          cp dist/KidsMonnter-Smart-cert.txt apk/KidsMonnter-Smart-cert.txt
          cp dist/KidsMonnter-Smart.sha256 apk/KidsMonnter-Smart.sha256
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk/KidsMonnter-Smart.apk apk/KidsMonnter-Smart-cert.txt apk/KidsMonnter-Smart.sha256
          git diff --cached --quiet || git commit -m "بناء KidsMonnter Smart APK بمستويي حماية"
          git push origin HEAD:main
