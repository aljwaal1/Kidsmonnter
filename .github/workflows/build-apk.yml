name: Build Final KidsMonnter APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'apk/**'
      - 'DOWNLOAD_APK.md'

concurrency:
  group: kidsmonnter-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      KEYSTORE_PASSWORD: KidsMonnter-Release-2026
      KEY_PASSWORD: KidsMonnter-Release-2026
      KEY_ALIAS: kidsmonnter

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore stable signing key
        uses: actions/cache@v4
        with:
          path: .signing/kidsmonnter-release.jks
          key: kidsmonnter-release-keystore-v2

      - name: Create signing key when absent
        run: |
          set -euo pipefail
          mkdir -p .signing
          if [ ! -s .signing/kidsmonnter-release.jks ]; then
            keytool -genkeypair \
              -keystore .signing/kidsmonnter-release.jks \
              -storepass "$KEYSTORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -alias "$KEY_ALIAS" \
              -keyalg RSA \
              -keysize 4096 \
              -validity 10000 \
              -dname "CN=KidsMonnter, OU=Android Release, O=KidsMonnter, L=Amman, C=JO"
          fi
          keytool -list \
            -keystore .signing/kidsmonnter-release.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null

      - name: Generate Android project
        run: flutter create --platforms=android --org com.explapp --no-pub .

      - name: Prepare final Play Protect compatible sources
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest_path = Path('native/AndroidManifest.xml')
          manifest = manifest_path.read_text(encoding='utf-8')
          manifest = re.sub(
              r'\n\s*<receiver\s+android:name="\.KidsMonnterDeviceAdminReceiver".*?</receiver>\s*',
              '\n', manifest, flags=re.S,
          )
          manifest = re.sub(
              r'\n\s*<service\s+android:name="\.UninstallGuardAccessibilityService".*?</service>\s*',
              '\n', manifest, flags=re.S,
          )
          manifest_path.write_text(manifest, encoding='utf-8')

          main_path = Path('lib/main.dart')
          main = main_path.read_text(encoding='utf-8')
          setup_pattern = re.compile(
              r'bool get _runtimeSetupReady =>\s*'
              r'\(_status\?\.overlayAllowed == true\)\s*&&\s*'
              r'_exactAlarmAllowed\s*&&\s*'
              r'_batteryOptimizationIgnored\s*&&\s*'
              r'_uninstallGuardEnabled\s*&&\s*'
              r'_devicePolicy\.adminActive;[^\n]*'
          )
          main, count = setup_pattern.subn(
              'bool get _runtimeSetupReady => true; // PLAY_PROTECT_COMPATIBLE_SETUP_MARKER',
              main,
              count=1,
          )
          if count != 1 and 'PLAY_PROTECT_COMPATIBLE_SETUP_MARKER' not in main:
              raise SystemExit('Could not update runtime setup gate')

          # Remove the complete Device Owner tile, including its tap handler.
          device_owner_ui = re.compile(
              r'\n\s*// DEFAULT_UNINSTALL_PROTECTION_UI_MARKER\s*'
              r'.*?onTap:\s*_busy\s*\|\|\s*_devicePolicy\.uninstallProtectionActive\s*'
              r'\?\s*null\s*:\s*_showDeviceOwnerInstructions,\s*'
              r'\),\s*const Divider\(height:\s*24\),',
              flags=re.S,
          )
          main, ui_count = device_owner_ui.subn(
              '\n            const Divider(height: 24),',
              main,
              count=1,
          )
          if ui_count != 1:
              raise SystemExit('Could not remove complete Device Owner UI block')

          main_path.write_text(main, encoding='utf-8')

          forbidden = [
              'android:name=".UninstallGuardAccessibilityService"',
              'android:name=".KidsMonnterDeviceAdminReceiver"',
              'DEFAULT_UNINSTALL_PROTECTION_UI_MARKER',
              'تفعيل منع الحذف الكامل',
              'adb shell dpm set-device-owner',
          ]
          for value in forbidden:
              if value in manifest or value in main:
                  raise SystemExit(f'Forbidden final-build content remains: {value}')
          PY

      - name: Install native Android implementation
        run: |
          set -euo pipefail
          rm -f test/widget_test.dart
          mkdir -p android/app/src/main/kotlin/com/explapp/kidstimeguard
          cp native/MainActivityV2.kt android/app/src/main/kotlin/com/explapp/kidstimeguard/MainActivity.kt
          cp native/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          rm -rf android/app/src/main/kotlin/com/explapp/kidsmonnter
          sed -i 's/com.explapp.kidsmonnter/com.explapp.kidstimeguard/g' android/app/build.gradle.kts
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/g' android/app/build.gradle.kts

      - name: Install packages
        run: flutter pub get

      - name: Format and analyze application
        run: |
          dart format lib
          flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        run: flutter build apk --release

      - name: Sign and verify final APK
        run: |
          set -euo pipefail
          INPUT_APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$INPUT_APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -x "$APKSIGNER"
          mkdir -p dist
          "$APKSIGNER" sign \
            --ks .signing/kidsmonnter-release.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out dist/KidsMonnter.apk \
            "$INPUT_APK"
          "$APKSIGNER" verify --verbose --print-certs dist/KidsMonnter.apk | tee dist/KidsMonnter-cert.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' dist/KidsMonnter-cert.txt
          sha256sum dist/KidsMonnter.apk | sed 's#dist/KidsMonnter.apk#KidsMonnter.apk#' | tee dist/KidsMonnter.sha256
          test -s dist/KidsMonnter.apk

      - name: Upload final APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KidsMonnter-final-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Publish final APK on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          mkdir -p apk
          cp dist/KidsMonnter.apk apk/KidsMonnter.apk
          cp dist/KidsMonnter-cert.txt apk/KidsMonnter-cert.txt
          cp dist/KidsMonnter.sha256 apk/KidsMonnter.sha256
          printf '# تحميل التطبيق\n\n[تحميل KidsMonnter APK](./apk/KidsMonnter.apk)\n\n- [بصمة SHA-256](./apk/KidsMonnter.sha256)\n- [معلومات شهادة التوقيع](./apk/KidsMonnter-cert.txt)\n' > DOWNLOAD_APK.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk/KidsMonnter.apk apk/KidsMonnter-cert.txt apk/KidsMonnter.sha256 DOWNLOAD_APK.md
          git diff --cached --quiet || git commit -m "بناء KidsMonnter النهائي بدون Device Owner"
          git push origin HEAD:main
