name: Build KidsMonnter APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'apk/**'
      - 'DOWNLOAD_APK.md'

concurrency:
  group: kidsmonnter-apk-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      KEYSTORE_PASSWORD: KidsMonnter-Release-2026
      KEY_PASSWORD: KidsMonnter-Release-2026
      KEY_ALIAS: kidsmonnter

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore signing key
        uses: actions/cache@v4
        with:
          path: .signing/kidsmonnter-release.jks
          key: kidsmonnter-release-keystore-v2

      - name: Prepare signing key
        run: |
          set -e
          mkdir -p .signing
          if [ ! -s .signing/kidsmonnter-release.jks ]; then
            keytool -genkeypair \
              -keystore .signing/kidsmonnter-release.jks \
              -storepass "$KEYSTORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 4096 -validity 10000 \
              -dname "CN=KidsMonnter, OU=Android Release, O=KidsMonnter, L=Amman, C=JO"
          fi

      - name: Generate Android project
        run: flutter create --platforms=android --org com.explapp --no-pub .

      - name: Prepare hardened parental uninstall guard
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest_path = Path('native/AndroidManifest.xml')
          manifest = manifest_path.read_text(encoding='utf-8')
          manifest = re.sub(
              r'\s*<receiver\s+android:name="\.KidsMonnterDeviceAdminReceiver".*?</receiver>',
              '', manifest, flags=re.S,
          )
          manifest = re.sub(
              r'(<service\s+android:name="\.UninstallGuardAccessibilityService".*?android:exported=")false(".*?</service>)',
              r'\1true\2', manifest, count=1, flags=re.S,
          )
          manifest_path.write_text(manifest, encoding='utf-8')

          main_path = Path('lib/main.dart')
          main = main_path.read_text(encoding='utf-8')
          main = re.sub(
              r'bool get _runtimeSetupReady =>.*?;\s*// MANDATORY_DEVICE_ADMIN_PROTECTION_MARKER',
              'bool get _runtimeSetupReady => true; // FINAL_BUILD_SETUP_READY',
              main,
              count=1,
              flags=re.S,
          )
          uninstall_card = r'''
            // Accessibility uninstall protection card
            Card(
              child: ListTile(
                leading: Icon(
                  _uninstallGuardEnabled ? Icons.verified_user : Icons.shield_outlined,
                  color: _uninstallGuardEnabled ? Colors.green : Colors.orange,
                ),
                title: Text(
                  _uninstallGuardEnabled
                      ? 'حماية حذف التطبيق مفعّلة'
                      : 'فعّل حماية حذف التطبيق',
                  style: const TextStyle(fontWeight: FontWeight.bold),
                ),
                subtitle: Text(
                  _uninstallGuardEnabled
                      ? 'الحذف ومعلومات التطبيق وتعطيل خدمة الحماية محمية برمز ولي الأمر.'
                      : 'تراقب الخدمة شاشات النظام المرتبطة بحذف KidsMonnter فقط، ولا ترسل محتوى الشاشة خارج الجهاز.',
                ),
                trailing: _uninstallGuardEnabled
                    ? const Icon(Icons.check_circle, color: Colors.green)
                    : FilledButton.tonal(
                        onPressed: _busy
                            ? null
                            : () => _channel.invokeMethod<void>('openAccessibilitySettings'),
                        child: const Text('موافق وتفعيل'),
                      ),
                onTap: _uninstallGuardEnabled || _busy
                    ? null
                    : () => _channel.invokeMethod<void>('openAccessibilitySettings'),
              ),
            ),
            const SizedBox(height: 10),
            const Divider(height: 24),'''
          main = re.sub(
              r'\s*// DEFAULT_UNINSTALL_PROTECTION_UI_MARKER.*?const Divider\(height: 24\),',
              '\n' + uninstall_card,
              main,
              count=1,
              flags=re.S,
          )
          main_path.write_text(main, encoding='utf-8')

          kotlin_path = Path('native/MainActivityV2.kt')
          kotlin = kotlin_path.read_text(encoding='utf-8')
          kotlin = re.sub(
              r'\s*// MANDATORY_DEVICE_OWNER_SETUP_MARKER\s*val missing = mutableListOf<String>\(\)\s*// MANDATORY_DEVICE_ADMIN_PROTECTION_MARKER\s*val dpm = getSystemService\(Context\.DEVICE_POLICY_SERVICE\) as DevicePolicyManager\s*val admin = ComponentName\(this, KidsMonnterDeviceAdminReceiver::class\.java\)\s*if \(!dpm\.isAdminActive\(admin\)\) missing\.add\("device_admin"\)',
              '\n                    val missing = mutableListOf<String>()\n                    // Device Admin is intentionally not used. Accessibility guard is required.',
              kotlin,
              count=1,
              flags=re.S,
          )
          kotlin = kotlin.replace(
              '        ensureUninstallProtection()\n        MethodChannel(',
              '        MethodChannel(',
              1,
          )
          kotlin = kotlin.replace(
              '                    ensureUninstallProtection()\n                    appendGuardLog("PROTECTION_ENABLED"',
              '                    appendGuardLog("PROTECTION_ENABLED"',
              1,
          )
          kotlin = kotlin.replace(
              '                    if (!Settings.canDrawOverlays(this)) missing.add("overlay")\n',
              '',
          )

          # Protect the Accessibility settings page itself so the child cannot disable the guard first.
          old_detection = '''        val destructiveAdminScreen = className.contains("DeviceAdmin", ignoreCase = true) &&
            listOf("deactivate", "disable", "إلغاء التنشيط", "تعطيل")
                .any { visibleText.contains(it, ignoreCase = true) }

        if (prefs.isParentAppSettingsAuthorized()) return
        if (uninstallScreen && !prefs.isParentUninstallAuthorized()) {'''
          new_detection = '''        val destructiveAdminScreen = className.contains("DeviceAdmin", ignoreCase = true) &&
            listOf("deactivate", "disable", "إلغاء التنشيط", "تعطيل")
                .any { visibleText.contains(it, ignoreCase = true) }
        val accessibilitySettingsScreen = listOf(
            "AccessibilitySettings",
            "AccessibilityService",
            "InstalledAccessibilityService",
            "ToggleAccessibilityServicePreferenceFragment",
            "AccessibilityDetailsSettingsFragment",
        ).any { className.contains(it, ignoreCase = true) } ||
            listOf(
                "accessibility",
                "إمكانية الوصول",
                "تسهيلات الاستخدام",
                "الخدمات المثبتة",
                "installed services",
            ).any { visibleText.contains(it, ignoreCase = true) }

        if (prefs.isParentAppSettingsAuthorized()) return
        if (accessibilitySettingsScreen) {
            launchParentGate(
                ForceStopPinActivity::class.java,
                "ACCESSIBILITY_GUARD_SETTINGS_INTERCEPTED",
                "package=$sourcePackage class=$className",
            )
            return
        }
        if (uninstallScreen && !prefs.isParentUninstallAuthorized()) {'''
          if old_detection not in kotlin:
              raise SystemExit('Expected uninstall guard detection block was not found')
          kotlin = kotlin.replace(old_detection, new_detection, 1)

          # Log service connection so real-device diagnostics can confirm that Android bound the service.
          old_interrupt = '    override fun onInterrupt() = Unit\n}'
          new_interrupt = '''    override fun onServiceConnected() {
        super.onServiceConnected()
        appendGuardLog(
            "UNINSTALL_GUARD_CONNECTED",
            "sdk=${Build.VERSION.SDK_INT} manufacturer=${Build.MANUFACTURER} model=${Build.MODEL}",
        )
    }

    override fun onInterrupt() {
        appendGuardLog("UNINSTALL_GUARD_INTERRUPTED")
    }
}'''
          if old_interrupt not in kotlin:
              raise SystemExit('Expected AccessibilityService ending was not found')
          kotlin = kotlin.replace(old_interrupt, new_interrupt, 1)
          kotlin_path.write_text(kotlin, encoding='utf-8')

          checks = {
              'device admin removed from manifest': 'KidsMonnterDeviceAdminReceiver' not in manifest,
              'accessibility service retained': 'UninstallGuardAccessibilityService' in manifest,
              'accessibility service exported': 'android:exported="true"' in manifest,
              'runtime gate bypassed': 'FINAL_BUILD_SETUP_READY' in main,
              'activation card added': 'فعّل حماية حذف التطبيق' in main,
              'device admin requirement removed': 'missing.add("device_admin")' not in kotlin,
              'uninstall guard requirement retained': 'missing.add("uninstall_guard")' in kotlin,
              'overlay requirement removed': 'missing.add("overlay")' not in kotlin,
              'accessibility settings protected': 'ACCESSIBILITY_GUARD_SETTINGS_INTERCEPTED' in kotlin,
              'service connection logged': 'UNINSTALL_GUARD_CONNECTED' in kotlin,
              'safe-mode style guard classes present': all(x in kotlin for x in (
                  'UninstallPinActivity', 'ForceStopPinActivity',
                  'UninstallGuardAccessibilityService', 'GLOBAL_ACTION_BACK',
              )),
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit('Source preparation failed: ' + ', '.join(failed))
          PY

      - name: Install native Android implementation
        run: |
          set -euo pipefail
          rm -f test/widget_test.dart
          mkdir -p android/app/src/main/kotlin/com/explapp/kidstimeguard
          cp native/MainActivityV2.kt android/app/src/main/kotlin/com/explapp/kidstimeguard/MainActivity.kt
          cp native/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          rm -rf android/app/src/main/kotlin/com/explapp/kidsmonnter
          rm -f android/app/src/main/res/xml/device_admin_receiver.xml
          mkdir -p android/app/src/main/res/xml android/app/src/main/res/values
          cat > android/app/src/main/res/xml/uninstall_guard_accessibility.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged|typeViewClicked|typeViewSelected"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagReportViewIds|flagRetrieveInteractiveWindows|flagIncludeNotImportantViews"
              android:canRetrieveWindowContent="true"
              android:description="@string/uninstall_guard_description"
              android:notificationTimeout="80" />
          XML
          cat > android/app/src/main/res/values/kidsmonnter_strings.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="uninstall_guard_description">تراقب هذه الخدمة شاشات النظام الخاصة بحذف KidsMonnter أو تعطيله، وتطلب رمز ولي الأمر. لا ترسل محتوى الشاشة خارج الجهاز.</string>
          </resources>
          XML
          sed -i 's/com.explapp.kidsmonnter/com.explapp.kidstimeguard/g' android/app/build.gradle.kts
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/g' android/app/build.gradle.kts

      - name: Install packages
        run: flutter pub get

      - name: Verify prepared sources
        run: |
          set -euo pipefail
          grep -q 'android:exported="true"' android/app/src/main/AndroidManifest.xml
          grep -q 'UninstallGuardAccessibilityService' android/app/src/main/AndroidManifest.xml
          grep -q 'ACCESSIBILITY_GUARD_SETTINGS_INTERCEPTED' android/app/src/main/kotlin/com/explapp/kidstimeguard/MainActivity.kt
          grep -q 'UNINSTALL_GUARD_CONNECTED' android/app/src/main/kotlin/com/explapp/kidstimeguard/MainActivity.kt
          grep -q 'flagRetrieveInteractiveWindows' android/app/src/main/res/xml/uninstall_guard_accessibility.xml
          ! grep -q 'missing.add("device_admin")' android/app/src/main/kotlin/com/explapp/kidstimeguard/MainActivity.kt
          ! grep -q 'missing.add("overlay")' android/app/src/main/kotlin/com/explapp/kidstimeguard/MainActivity.kt

      - name: Clean Gradle state
        run: |
          flutter clean
          rm -rf android/.gradle

      - name: Build release APK
        run: flutter build apk --release

      - name: Sign and verify APK
        run: |
          set -euo pipefail
          INPUT_APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$INPUT_APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          mkdir -p dist
          "$APKSIGNER" sign \
            --ks .signing/kidsmonnter-release.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out dist/KidsMonnter.apk \
            "$INPUT_APK"
          "$APKSIGNER" verify --verbose --print-certs dist/KidsMonnter.apk | tee dist/KidsMonnter-cert.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' dist/KidsMonnter-cert.txt
          sha256sum dist/KidsMonnter.apk | sed 's#dist/KidsMonnter.apk#KidsMonnter.apk#' > dist/KidsMonnter.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KidsMonnter-${{ github.sha }}
          path: dist/
          if-no-files-found: error

      - name: Publish APK to main
        run: |
          set -euo pipefail
          mkdir -p apk
          cp dist/KidsMonnter.apk apk/KidsMonnter.apk
          cp dist/KidsMonnter-cert.txt apk/KidsMonnter-cert.txt
          cp dist/KidsMonnter.sha256 apk/KidsMonnter.sha256
          printf '# تحميل التطبيق\n\n[تحميل KidsMonnter APK](./apk/KidsMonnter.apk)\n\n- [بصمة SHA-256](./apk/KidsMonnter.sha256)\n- [معلومات شهادة التوقيع](./apk/KidsMonnter-cert.txt)\n' > DOWNLOAD_APK.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk/KidsMonnter.apk apk/KidsMonnter-cert.txt apk/KidsMonnter.sha256 DOWNLOAD_APK.md
          git diff --cached --quiet || git commit -m "بناء KidsMonnter بحارس حذف قوي ومحمي من التعطيل"
          git push origin HEAD:main
