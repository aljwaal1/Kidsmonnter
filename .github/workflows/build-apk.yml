name: Build KidsMonnter APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'apk/**'
      - 'DOWNLOAD_APK.md'

concurrency:
  group: kidsmonnter-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create --platforms=android --org com.explapp --no-pub .

      - name: Prepare Play Protect compatible sources
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest_path = Path('native/AndroidManifest.xml')
          manifest = manifest_path.read_text(encoding='utf-8')
          manifest = re.sub(
              r'\n\s*<receiver\s+android:name="\.KidsMonnterDeviceAdminReceiver".*?</receiver>\s*',
              '\n', manifest, flags=re.S,
          )
          manifest = re.sub(
              r'\n\s*<service\s+android:name="\.UninstallGuardAccessibilityService".*?</service>\s*',
              '\n', manifest, flags=re.S,
          )
          manifest_path.write_text(manifest, encoding='utf-8')

          main_path = Path('lib/main.dart')
          main = main_path.read_text(encoding='utf-8')
          pattern = re.compile(
              r'bool get _runtimeSetupReady =>\s*'
              r'\(_status\?\.overlayAllowed == true\)\s*&&\s*'
              r'_exactAlarmAllowed\s*&&\s*'
              r'_batteryOptimizationIgnored\s*&&\s*'
              r'_uninstallGuardEnabled\s*&&\s*'
              r'_devicePolicy\.adminActive;[^\n]*'
          )
          main, count = pattern.subn(
              'bool get _runtimeSetupReady => true; // PLAY_PROTECT_COMPATIBLE_SETUP_MARKER',
              main,
              count=1,
          )
          if count != 1 and 'PLAY_PROTECT_COMPATIBLE_SETUP_MARKER' not in main:
              raise SystemExit('Could not update runtime setup gate')
          main_path.write_text(main, encoding='utf-8')

          assert 'android:name=".UninstallGuardAccessibilityService"' not in manifest
          assert 'android:name=".KidsMonnterDeviceAdminReceiver"' not in manifest
          PY

      - name: Install native Android implementation
        run: |
          rm -f test/widget_test.dart
          mkdir -p android/app/src/main/kotlin/com/explapp/kidstimeguard
          cp native/MainActivityV2.kt android/app/src/main/kotlin/com/explapp/kidstimeguard/MainActivity.kt
          cp native/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/res/xml android/app/src/main/res/values
          cp native/res/xml/device_admin_receiver.xml android/app/src/main/res/xml/device_admin_receiver.xml
          cp native/res/values/device_admin_strings.xml android/app/src/main/res/values/device_admin_strings.xml
          rm -rf android/app/src/main/kotlin/com/explapp/kidsmonnter
          sed -i 's/com.explapp.kidsmonnter/com.explapp.kidstimeguard/g' android/app/build.gradle.kts
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/g' android/app/build.gradle.kts

      - name: Install packages
        run: flutter pub get

      - name: Analyze application
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify generated APK
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/KidsMonnter.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KidsMonnter-${{ github.sha }}
          path: dist/KidsMonnter.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p apk
          cp dist/KidsMonnter.apk apk/KidsMonnter.apk
          printf '# تحميل التطبيق\n\n[تحميل KidsMonnter APK](./apk/KidsMonnter.apk)\n' > DOWNLOAD_APK.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk/KidsMonnter.apk DOWNLOAD_APK.md
          git diff --cached --quiet || git commit -m "بناء KidsMonnter المتوافق مع Play Protect"
          git push origin HEAD:main
