name: Build KidsMonnter APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'apk/**'
      - 'DOWNLOAD_APK.md'

concurrency:
  group: kidsmonnter-apk-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      KEYSTORE_PASSWORD: KidsMonnter-Release-2026
      KEY_PASSWORD: KidsMonnter-Release-2026
      KEY_ALIAS: kidsmonnter

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore signing key
        uses: actions/cache@v4
        with:
          path: .signing/kidsmonnter-release.jks
          key: kidsmonnter-release-keystore-v2

      - name: Prepare signing key
        run: |
          set -e
          mkdir -p .signing
          if [ ! -s .signing/kidsmonnter-release.jks ]; then
            keytool -genkeypair \
              -keystore .signing/kidsmonnter-release.jks \
              -storepass "$KEYSTORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 4096 -validity 10000 \
              -dname "CN=KidsMonnter, OU=Android Release, O=KidsMonnter, L=Amman, C=JO"
          fi

      - name: Generate Android project
        run: flutter create --platforms=android --org com.explapp --no-pub .

      - name: Remove Device Owner and Accessibility UI
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest_path = Path('native/AndroidManifest.xml')
          manifest = manifest_path.read_text(encoding='utf-8')
          manifest = re.sub(
              r'\s*<receiver\s+android:name="\.KidsMonnterDeviceAdminReceiver".*?</receiver>',
              '', manifest, flags=re.S,
          )
          manifest = re.sub(
              r'\s*<service\s+android:name="\.UninstallGuardAccessibilityService".*?</service>',
              '', manifest, flags=re.S,
          )
          manifest_path.write_text(manifest, encoding='utf-8')

          main_path = Path('lib/main.dart')
          main = main_path.read_text(encoding='utf-8')

          main, runtime_count = re.subn(
              r'bool get _runtimeSetupReady =>.*?;\s*// MANDATORY_DEVICE_ADMIN_PROTECTION_MARKER',
              'bool get _runtimeSetupReady => true; // FINAL_BUILD_SETUP_READY',
              main,
              count=1,
              flags=re.S,
          )

          main, ui_count = re.subn(
              r'\s*// DEFAULT_UNINSTALL_PROTECTION_UI_MARKER.*?'
              r'(?=\s*Card\(\s*child:\s*ListTile\(\s*leading:\s*Icon\(status\.hasPin)',
              '\n            // DEVICE_OWNER_UI_REMOVED\n',
              main,
              count=1,
              flags=re.S,
          )

          main_path.write_text(main, encoding='utf-8')

          failures = []
          if 'KidsMonnterDeviceAdminReceiver' in manifest:
              failures.append('Device Admin receiver remains in manifest')
          if 'UninstallGuardAccessibilityService' in manifest:
              failures.append('Accessibility service remains in manifest')
          if runtime_count != 1 or 'FINAL_BUILD_SETUP_READY' not in main:
              failures.append('Runtime setup gate was not bypassed')
          if ui_count != 1 or 'DEVICE_OWNER_UI_REMOVED' not in main:
              failures.append('Device Owner UI block was not removed')
          if 'منع الحذف يحتاج إعداد الجهاز مرة واحدة' in main:
              failures.append('Old Device Owner message remains in visible UI')
          if 'DEFAULT_UNINSTALL_PROTECTION_UI_MARKER' in main:
              failures.append('Old uninstall protection UI marker remains')

          if failures:
              raise SystemExit('\n'.join(failures))
          PY

      - name: Install native Android implementation
        run: |
          set -e
          rm -f test/widget_test.dart
          mkdir -p android/app/src/main/kotlin/com/explapp/kidstimeguard
          cp native/MainActivityV2.kt android/app/src/main/kotlin/com/explapp/kidstimeguard/MainActivity.kt
          cp native/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          rm -rf android/app/src/main/kotlin/com/explapp/kidsmonnter
          rm -f android/app/src/main/res/xml/uninstall_guard_accessibility.xml
          rm -f android/app/src/main/res/xml/device_admin_receiver.xml
          sed -i 's/com.explapp.kidsmonnter/com.explapp.kidstimeguard/g' android/app/build.gradle.kts
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/g' android/app/build.gradle.kts

      - name: Install packages
        run: flutter pub get

      - name: Clean Gradle state
        run: |
          flutter clean
          rm -rf android/.gradle

      - name: Build release APK
        run: flutter build apk --release

      - name: Sign and verify APK
        run: |
          set -e
          INPUT_APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$INPUT_APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          mkdir -p dist
          "$APKSIGNER" sign \
            --ks .signing/kidsmonnter-release.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out dist/KidsMonnter.apk \
            "$INPUT_APK"
          "$APKSIGNER" verify --verbose --print-certs dist/KidsMonnter.apk | tee dist/KidsMonnter-cert.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' dist/KidsMonnter-cert.txt
          sha256sum dist/KidsMonnter.apk | sed 's#dist/KidsMonnter.apk#KidsMonnter.apk#' > dist/KidsMonnter.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KidsMonnter-${{ github.sha }}
          path: dist/
          if-no-files-found: error

      - name: Publish APK to main
        run: |
          set -e
          mkdir -p apk
          cp dist/KidsMonnter.apk apk/KidsMonnter.apk
          cp dist/KidsMonnter-cert.txt apk/KidsMonnter-cert.txt
          cp dist/KidsMonnter.sha256 apk/KidsMonnter.sha256
          printf '# تحميل التطبيق\n\n[تحميل KidsMonnter APK](./apk/KidsMonnter.apk)\n\n- [بصمة SHA-256](./apk/KidsMonnter.sha256)\n- [معلومات شهادة التوقيع](./apk/KidsMonnter-cert.txt)\n' > DOWNLOAD_APK.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk/KidsMonnter.apk apk/KidsMonnter-cert.txt apk/KidsMonnter.sha256 DOWNLOAD_APK.md
          git diff --cached --quiet || git commit -m "بناء KidsMonnter APK بدون Device Owner"
          git push origin HEAD:main
