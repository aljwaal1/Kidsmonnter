name: Build APK Direct

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'apk/**'
      - 'DOWNLOAD_APK.md'

concurrency:
  group: kidsmonnter-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Merge preflight hardening into sources
        run: python3 tools/merge_preflight_hardening.py

      - name: Merge service watchdog into native source
        run: python3 tools/merge_service_watchdog.py

      - name: Merge dedicated service restart channel
        run: python3 tools/merge_service_restart_channel.py

      - name: Merge status self-heal into native source
        run: python3 tools/merge_status_self_heal.py

      - name: Merge service restart cooldown
        run: python3 tools/merge_service_restart_cooldown.py

      - name: Merge notification permission request
        run: python3 tools/merge_notification_permission.py

      - name: Merge guard notification navigation
        run: python3 tools/merge_guard_notification_navigation.py

      - name: Merge lock launch cooldown
        run: python3 tools/merge_lock_launch_cooldown.py

      - name: Replace lock screen with safe internal keypad
        run: python3 tools/merge_safe_lock_keypad.py

      - name: Merge emergency protection stop into lock screen
        run: python3 tools/merge_lock_emergency_stop.py

      - name: Verify merge tools are idempotent
        run: |
          cp native/MainActivityV2.kt /tmp/MainActivityV2.after-first-merge.kt
          cp lib/main.dart /tmp/main.after-first-merge.dart
          python3 tools/merge_preflight_hardening.py
          python3 tools/merge_service_watchdog.py
          python3 tools/merge_service_restart_channel.py
          python3 tools/merge_status_self_heal.py
          python3 tools/merge_service_restart_cooldown.py
          python3 tools/merge_notification_permission.py
          python3 tools/merge_guard_notification_navigation.py
          python3 tools/merge_lock_launch_cooldown.py
          python3 tools/merge_safe_lock_keypad.py
          python3 tools/merge_lock_emergency_stop.py
          cmp --silent /tmp/MainActivityV2.after-first-merge.kt native/MainActivityV2.kt
          cmp --silent /tmp/main.after-first-merge.dart lib/main.dart

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project
        run: flutter create --platforms=android --org com.explapp --no-pub .

      - name: Remove generated default test only
        run: rm -f test/widget_test.dart

      - name: Install native monitoring files
        run: |
          test -f native/MainActivityV2.kt
          test -f native/AndroidManifest.xml
          test -f test/guard_status_test.dart
          test -f test/service_watchdog_contract_test.dart
          test -f test/status_self_heal_contract_test.dart
          test -f test/service_restart_cooldown_contract_test.dart
          test -f test/notification_permission_contract_test.dart
          test -f test/guard_notification_navigation_contract_test.dart
          test -f test/lock_launch_cooldown_contract_test.dart
          test -f test/safe_lock_keypad_contract_test.dart
          test -f test/lock_emergency_stop_contract_test.dart
          grep -q 'uninstallBlocked' lib/main.dart
          grep -q 'isUninstallBlocked' native/MainActivityV2.kt
          grep -q 'PendingIntent.getBroadcast' native/MainActivityV2.kt
          grep -q 'MONITOR_WATCHDOG_ACTION' native/MainActivityV2.kt
          grep -q '"restartProtectionService"' native/MainActivityV2.kt
          grep -q 'shouldRecoverProtectionService' native/MainActivityV2.kt
          grep -q 'requestMonitorServiceStartIfAllowed' native/MainActivityV2.kt
          grep -q 'SERVICE_START_REQUEST_COOLDOWN_MS' native/MainActivityV2.kt
          grep -q 'requestNotificationPermissionIfNeeded' native/MainActivityV2.kt
          grep -q 'Manifest.permission.POST_NOTIFICATIONS' native/MainActivityV2.kt
          grep -q 'guardNotificationContentIntent' native/MainActivityV2.kt
          grep -q 'setContentIntent' native/MainActivityV2.kt
          grep -q 'LOCK_LAUNCH_COOLDOWN_MS' native/MainActivityV2.kt
          grep -q 'lastLockLaunchElapsedMs' native/MainActivityV2.kt
          grep -q 'GridLayout(this)' native/MainActivityV2.kt
          grep -q 'unlockWithPin(addTime = true)' native/MainActivityV2.kt
          grep -q 'unlockWithPin(addTime = false)' native/MainActivityV2.kt
          grep -q 'disableProtectionWithPin()' native/MainActivityV2.kt
          grep -q 'text = "إيقاف الحماية"' native/MainActivityV2.kt
          ! sed -n '/class LockActivity/,/class KidsMonnterDeviceAdminReceiver/p' native/MainActivityV2.kt | grep -q 'EditText(this)'
          ! sed -n '/class LockActivity/,/class KidsMonnterDeviceAdminReceiver/p' native/MainActivityV2.kt | grep -q 'FLAG_TURN_SCREEN_ON'
          ! grep -q 'PendingIntent.getService' native/MainActivityV2.kt
          mkdir -p android/app/src/main/kotlin/com/explapp/kidstimeguard
          cp native/MainActivityV2.kt android/app/src/main/kotlin/com/explapp/kidstimeguard/MainActivity.kt
          cp native/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/res/xml android/app/src/main/res/values
          cp native/res/xml/device_admin_receiver.xml android/app/src/main/res/xml/device_admin_receiver.xml
          cp native/res/values/device_admin_strings.xml android/app/src/main/res/values/device_admin_strings.xml
          rm -rf android/app/src/main/kotlin/com/explapp/kidsmonnter
          sed -i 's/com.explapp.kidsmonnter/com.explapp.kidstimeguard/g' android/app/build.gradle.kts || true
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/g' android/app/build.gradle.kts || true

      - name: Install packages
        run: flutter pub get

      - name: Normalize Dart formatting in build workspace
        run: dart format lib test

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Copy APK
        run: |
          mkdir -p apk
          cp build/app/outputs/flutter-apk/app-release.apk apk/KidsMonnter.apk
          printf '# تحميل التطبيق\n\n[تحميل KidsMonnter APK](./apk/KidsMonnter.apk)\n' > DOWNLOAD_APK.md

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KidsMonnter-${{ github.sha }}
          path: apk/KidsMonnter.apk
          if-no-files-found: error
          retention-days: 14

      - name: Commit merged sources and APK
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/main.dart native/MainActivityV2.kt apk/KidsMonnter.apk DOWNLOAD_APK.md
          git diff --cached --quiet || git commit -m "إعادة بناء شاشة القفل الآمنة وتحديث ملف APK"
          git push
