name: Build Signed KidsMonnter APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'apk/**'
      - 'DOWNLOAD_APK.md'

concurrency:
  group: kidsmonnter-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'KidsMonnter-Release-2026' }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || 'KidsMonnter-Release-2026' }}
      KEY_ALIAS: kidsmonnter

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore persistent release signing key
        uses: actions/cache@v4
        with:
          path: .signing/kidsmonnter-release.jks
          key: kidsmonnter-release-keystore-v1

      - name: Create release signing key when absent
        run: |
          set -euo pipefail
          mkdir -p .signing
          if [ ! -s .signing/kidsmonnter-release.jks ]; then
            keytool -genkeypair \
              -v \
              -keystore .signing/kidsmonnter-release.jks \
              -storepass "$KEYSTORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -alias "$KEY_ALIAS" \
              -keyalg RSA \
              -keysize 4096 \
              -validity 10000 \
              -dname "CN=KidsMonnter, OU=Android Release, O=KidsMonnter, L=Amman, C=JO"
          fi
          test -s .signing/kidsmonnter-release.jks

      - name: Generate Android project
        run: flutter create --platforms=android --org com.explapp --no-pub .

      - name: Prepare Play Protect compatible sources
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest_path = Path('native/AndroidManifest.xml')
          manifest = manifest_path.read_text(encoding='utf-8')
          manifest = re.sub(
              r'\n\s*<receiver\s+android:name="\.KidsMonnterDeviceAdminReceiver".*?</receiver>\s*',
              '\n', manifest, flags=re.S,
          )
          manifest = re.sub(
              r'\n\s*<service\s+android:name="\.UninstallGuardAccessibilityService".*?</service>\s*',
              '\n', manifest, flags=re.S,
          )
          manifest_path.write_text(manifest, encoding='utf-8')

          main_path = Path('lib/main.dart')
          main = main_path.read_text(encoding='utf-8')
          pattern = re.compile(
              r'bool get _runtimeSetupReady =>\s*'
              r'\(_status\?\.overlayAllowed == true\)\s*&&\s*'
              r'_exactAlarmAllowed\s*&&\s*'
              r'_batteryOptimizationIgnored\s*&&\s*'
              r'_uninstallGuardEnabled\s*&&\s*'
              r'_devicePolicy\.adminActive;[^\n]*'
          )
          main, count = pattern.subn(
              'bool get _runtimeSetupReady => true; // PLAY_PROTECT_COMPATIBLE_SETUP_MARKER',
              main,
              count=1,
          )
          if count != 1 and 'PLAY_PROTECT_COMPATIBLE_SETUP_MARKER' not in main:
              raise SystemExit('Could not update runtime setup gate')
          main_path.write_text(main, encoding='utf-8')

          assert 'android:name=".UninstallGuardAccessibilityService"' not in manifest
          assert 'android:name=".KidsMonnterDeviceAdminReceiver"' not in manifest
          PY

      - name: Install native Android implementation
        run: |
          set -euo pipefail
          rm -f test/widget_test.dart
          mkdir -p android/app/src/main/kotlin/com/explapp/kidstimeguard
          cp native/MainActivityV2.kt android/app/src/main/kotlin/com/explapp/kidstimeguard/MainActivity.kt
          cp native/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/res/xml android/app/src/main/res/values
          cp native/res/xml/device_admin_receiver.xml android/app/src/main/res/xml/device_admin_receiver.xml
          cp native/res/values/device_admin_strings.xml android/app/src/main/res/values/device_admin_strings.xml
          rm -rf android/app/src/main/kotlin/com/explapp/kidsmonnter
          sed -i 's/com.explapp.kidsmonnter/com.explapp.kidstimeguard/g' android/app/build.gradle.kts
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/g' android/app/build.gradle.kts

      - name: Configure stable release signing
        run: |
          set -euo pipefail
          cp .signing/kidsmonnter-release.jks android/app/kidsmonnter-release.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=kidsmonnter-release.jks
          EOF

          python3 - <<'PY'
          from pathlib import Path

          path = Path('android/app/build.gradle.kts')
          text = path.read_text(encoding='utf-8')

          properties_block = '''val keystoreProperties = java.util.Properties()
          val keystorePropertiesFile = rootProject.file("key.properties")
          if (keystorePropertiesFile.exists()) {
              java.io.FileInputStream(keystorePropertiesFile).use { keystoreProperties.load(it) }
          }

          '''
          if 'val keystoreProperties = java.util.Properties()' not in text:
              text = text.replace('android {', properties_block + 'android {', 1)

          signing_block = '''    signingConfigs {
              create("release") {
                  keyAlias = keystoreProperties["keyAlias"] as String
                  keyPassword = keystoreProperties["keyPassword"] as String
                  storeFile = file(keystoreProperties["storeFile"] as String)
                  storePassword = keystoreProperties["storePassword"] as String
              }
          }

          '''
          if 'create("release")' not in text:
              text = text.replace('    buildTypes {', signing_block + '    buildTypes {', 1)

          old = 'signingConfig = signingConfigs.getByName("debug")'
          if old not in text and 'signingConfig = signingConfigs.getByName("release")' not in text:
              raise SystemExit('Release signing assignment was not found')
          text = text.replace(old, 'signingConfig = signingConfigs.getByName("release")')
          path.write_text(text, encoding='utf-8')
          PY

          grep -q 'create("release")' android/app/build.gradle.kts
          grep -q 'signingConfigs.getByName("release")' android/app/build.gradle.kts

      - name: Install packages
        run: flutter pub get

      - name: Analyze application
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build signed release APK
        run: flutter build apk --release

      - name: Verify signature and generated APK
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee apk-signature.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' apk-signature.txt
          sha256sum "$APK" | tee KidsMonnter.sha256
          mkdir -p dist
          cp "$APK" dist/KidsMonnter.apk
          cp apk-signature.txt dist/KidsMonnter-cert.txt
          cp KidsMonnter.sha256 dist/KidsMonnter.sha256

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KidsMonnter-signed-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Publish signed APK on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          mkdir -p apk
          cp dist/KidsMonnter.apk apk/KidsMonnter.apk
          cp dist/KidsMonnter-cert.txt apk/KidsMonnter-cert.txt
          cp dist/KidsMonnter.sha256 apk/KidsMonnter.sha256
          printf '# تحميل التطبيق\n\n[تحميل KidsMonnter APK](./apk/KidsMonnter.apk)\n\n- [بصمة SHA-256](./apk/KidsMonnter.sha256)\n- [معلومات شهادة التوقيع](./apk/KidsMonnter-cert.txt)\n' > DOWNLOAD_APK.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk/KidsMonnter.apk apk/KidsMonnter-cert.txt apk/KidsMonnter.sha256 DOWNLOAD_APK.md
          git diff --cached --quiet || git commit -m "بناء KidsMonnter بتوقيع Release ثابت"
          git push origin HEAD:main
