name: Build KidsMonnter Unified APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'apk/**'
      - 'DOWNLOAD_APK.md'
  push:
    branches: [main]
    paths-ignore:
      - 'apk/**'
      - 'DOWNLOAD_APK.md'

concurrency:
  group: kidsmonnter-unified-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KEYSTORE_PASSWORD: KidsMonnter-Release-2026
      KEY_PASSWORD: KidsMonnter-Release-2026
      KEY_ALIAS: kidsmonnter
      EXPECTED_CERT_SHA256: 3626d5e77223759fc15f1411c1bc8f96021a07b86eb0a86975083364a6443096

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore fixed signing key
        uses: actions/cache@v4
        with:
          path: .signing/kidsmonnter-release.jks
          key: kidsmonnter-release-keystore-v2

      - name: Verify signing key is available
        run: |
          set -euo pipefail
          test -s .signing/kidsmonnter-release.jks || {
            echo 'Release keystore is missing. Refusing to create a new signing identity.' >&2
            exit 1
          }

      - name: Generate Android project
        run: flutter create --platforms=android --org com.explapp --no-pub .

      - name: Install unified parental-control implementation
        run: |
          set -euo pipefail
          rm -f test/widget_test.dart
          mkdir -p android/app/src/main/kotlin/com/explapp/kidstimeguard
          cp native/MainActivityV2.kt android/app/src/main/kotlin/com/explapp/kidstimeguard/MainActivity.kt
          cp native/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          rm -rf android/app/src/main/kotlin/com/explapp/kidsmonnter
          mkdir -p android/app/src/main/res/xml android/app/src/main/res/values

          cat > android/app/src/main/res/xml/device_admin_receiver.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <device-admin xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-policies>
                  <force-lock />
              </uses-policies>
          </device-admin>
          XML

          cat > android/app/src/main/res/xml/uninstall_guard_accessibility.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged|typeViewClicked|typeViewSelected"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagReportViewIds|flagRetrieveInteractiveWindows|flagIncludeNotImportantViews"
              android:canRetrieveWindowContent="true"
              android:description="@string/uninstall_guard_description"
              android:notificationTimeout="80" />
          XML

          cat > android/app/src/main/res/values/kidsmonnter_strings.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="device_admin_description">يساعد KidsMonnter على حماية إعدادات الرقابة الأبوية ومنع تعطيلها دون موافقة ولي الأمر.</string>
              <string name="uninstall_guard_description">تراقب هذه الخدمة شاشات النظام المرتبطة بحذف KidsMonnter أو إيقافه، وتطلب رمز ولي الأمر. لا ترسل محتوى الشاشة خارج الجهاز.</string>
          </resources>
          XML

          sed -i 's/com.explapp.kidsmonnter/com.explapp.kidstimeguard/g' android/app/build.gradle.kts
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/g' android/app/build.gradle.kts

      - name: Apply parental-control security hardening
        run: |
          set -euo pipefail
          python3 tools/harden_unified.py
          python3 tools/post_harden_fix.py

      - name: Verify unified protection structure
        run: |
          set -euo pipefail
          MANIFEST=android/app/src/main/AndroidManifest.xml
          KOTLIN=android/app/src/main/kotlin/com/explapp/kidstimeguard/MainActivity.kt

          grep -q 'android.permission.SYSTEM_ALERT_WINDOW' "$MANIFEST"
          grep -q 'KidsMonnterDeviceAdminReceiver' "$MANIFEST"
          grep -q 'UninstallGuardAccessibilityService' "$MANIFEST"
          grep -q 'MonitorService' "$MANIFEST"
          grep -q 'BootReceiver' "$MANIFEST"
          grep -q 'android.intent.action.BOOT_COMPLETED' "$MANIFEST"
          grep -q 'missing.add("device_admin")' "$KOTLIN"
          grep -q 'missing.add("uninstall_guard")' "$KOTLIN"
          grep -q 'missing.add("overlay")' "$KOTLIN"
          grep -q 'missing.add("battery")' "$KOTLIN"
          grep -q 'missing.add("exact_alarm")' "$KOTLIN"
          grep -q 'setUninstallBlocked' "$KOTLIN"
          grep -q 'startLockTask' "$KOTLIN"
          grep -q 'LOCK_TRIGGERED' "$KOTLIN"
          grep -q 'UNINSTALL_AUTHORIZED_BY_PARENT_PIN' "$KOTLIN"
          grep -q 'PBKDF2WithHmacSHA256' "$KOTLIN"
          grep -q 'TIME_TAMPER_DETECTED' "$KOTLIN"
          grep -q 'LOCK_FAIL_SAFE' "$KOTLIN"
          grep -q 'UNIFIED_SECURITY_HARDENING_V2' "$KOTLIN"
          grep -q 'UNIFIED_SECURITY_HARDENING_V2_POSTFIX' "$KOTLIN"
          ! grep -q 'return "$PIN_HASH_PREFIX$$PIN_HASH_ITERATIONS' "$KOTLIN"

      - name: Install packages
        run: flutter pub get

      - name: Analyze Flutter sources
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run Flutter tests
        run: flutter test

      - name: Clean Gradle state
        run: |
          flutter clean
          rm -rf android/.gradle

      - name: Build unified release APK
        run: flutter build apk --release

      - name: Sign and verify unified APK
        run: |
          set -euo pipefail
          INPUT_APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$INPUT_APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          mkdir -p dist
          "$APKSIGNER" sign \
            --ks .signing/kidsmonnter-release.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out dist/KidsMonnter.apk \
            "$INPUT_APK"
          "$APKSIGNER" verify --verbose --print-certs dist/KidsMonnter.apk | tee dist/KidsMonnter-cert.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' dist/KidsMonnter-cert.txt
          grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' dist/KidsMonnter-cert.txt
          grep -qi "$EXPECTED_CERT_SHA256" dist/KidsMonnter-cert.txt
          sha256sum dist/KidsMonnter.apk | sed 's#dist/KidsMonnter.apk#KidsMonnter.apk#' > dist/KidsMonnter.sha256
          (cd dist && sha256sum -c KidsMonnter.sha256)

      - name: Upload unified artifact
        uses: actions/upload-artifact@v4
        with:
          name: KidsMonnter-${{ github.sha }}
          path: dist/
          if-no-files-found: error

      - name: Publish the single official APK
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          mkdir -p apk
          cp dist/KidsMonnter.apk apk/KidsMonnter.apk
          cp dist/KidsMonnter-cert.txt apk/KidsMonnter-cert.txt
          cp dist/KidsMonnter.sha256 apk/KidsMonnter.sha256

          git rm -f --ignore-unmatch \
            apk/KidsMonnter-Safe.apk \
            apk/KidsMonnter-Safe-cert.txt \
            apk/KidsMonnter-Safe.sha256 \
            apk/KidsMonnter-Smart.apk \
            apk/KidsMonnter-Smart-cert.txt \
            apk/KidsMonnter-Smart.sha256

          cat > DOWNLOAD_APK.md <<'EOF'
          # تحميل KidsMonnter

          توجد نسخة رسمية واحدة فقط من التطبيق:

          [تحميل KidsMonnter APK](./apk/KidsMonnter.apk)

          ## التحقق من الملف

          - [بصمة SHA-256](./apk/KidsMonnter.sha256)
          - [معلومات شهادة التوقيع](./apk/KidsMonnter-cert.txt)

          تتطلب الحماية تفعيل صلاحيات مسؤول الجهاز، وإمكانية الوصول، والظهور فوق التطبيقات، واستثناء البطارية، والمنبه الدقيق. لا يبدأ التطبيق الحماية قبل اكتمال المتطلبات.
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apk/KidsMonnter.apk \
            apk/KidsMonnter-cert.txt \
            apk/KidsMonnter.sha256 \
            DOWNLOAD_APK.md
          git diff --cached --quiet || git commit -m "بناء نسخة KidsMonnter الموحدة المحسنة"
          git push origin HEAD:main
